<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMP Heavy RP - Launcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        .header {
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(18,18,18,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        .main-content {
            flex: 1;
            display: flex;
            padding: 20px;
        }
        .news {
            flex: 2;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            margin-right: 20px;
        }
        .actions {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .progress-container {
            background-color: #222;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
            height: 20px;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.2s;
        }
        .status-text {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        .settings-input {
            margin-bottom: 15px;
        }
        .settings-input input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .settings-input label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SKYMP HEAVY RP</h1>
        <div style="font-size:12px; color:#aaa;">v1.0.0-beta</div>
    </div>
    
    <div class="main-content">
        <div class="news">
            <h2>Changelog / Notícias</h2>
            <ul>
                <li><strong>12 Jul:</strong> Lançamento do Launcher Beta.</li>
                <li><strong>10 Jul:</strong> Testes de carga na economia de Whiterun concluídos.</li>
                <li><strong>05 Jul:</strong> Sistema de Disfarces e Prisão ativos.</li>
            </ul>
        </div>
        
        <div class="actions">
            <div class="settings-input">
                <label>Caminho do Jogo (Onde está o Skyrim SE)</label>
                <input type="text" id="game-path" value="C:\Program Files (x86)\Steam\steamapps\common\Skyrim Special Edition">
            </div>
            
            <div class="status-text" id="status-text">Pronto.</div>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <button id="main-btn">Verificar & Jogar</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
